{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "تنظیمات" %}{% endblock %}
{% block body %}
<div class="app-layout">
  {% include "partials/sidebar.html" %}
  <div class="main-content">
    {% include "partials/topbar.html" %}
    <div class="content-area">
      <div class="card mb-3">
        <div class="card-header"><h3 class="card-title">{% trans "ظاهر" %}</h3></div>
        <div class="flex-between mb-2">
          <span>{% trans "تم تاریک / روشن" %}</span>
          <button class="theme-toggle" id="themeToggle"><span>☀️</span></button>
        </div>
        <div class="flex-between">
          <span>{% trans "زبان" %}</span>
          <form action="{% url 'set_language' %}" method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.path }}">
            <button type="submit" name="language" value="{% if LANGUAGE_CODE == 'fa' %}en{% else %}fa{% endif %}" class="lang-toggle">
              <span>{% if LANGUAGE_CODE == 'fa' %}EN{% else %}FA{% endif %}</span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
