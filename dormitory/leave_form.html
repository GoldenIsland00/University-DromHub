{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "درخواست مرخصی" %}{% endblock %}
{% block body %}
<div class="app-layout">
{% include "partials/sidebar.html" %}
<div class="main-content">
{% include "partials/topbar.html" with page_title=_("درخواست مرخصی") %}
<div class="content-area">
<div class="card" style="max-width:480px;">
<form method="post">{% csrf_token %}
  <div class="form-group mb-3"><label class="form-label">{% trans "زمان خروج" %}</label>
    <input class="form-control" type="datetime-local" name="start_at" required></div>
  <div class="form-group mb-3"><label class="form-label">{% trans "زمان بازگشت پیش‌بینی‌شده" %}</label>
    <input class="form-control" type="datetime-local" name="end_at" required></div>
  <div class="form-group mb-3"><label class="form-label">{% trans "مقصد" %}</label>
    <input class="form-control" name="destination"></div>
  <div class="form-group mb-3"><label class="form-label">{% trans "دلیل" %}</label>
    <textarea class="form-control" name="reason" rows="3" required></textarea></div>
  <button class="btn btn-primary">{% trans "ثبت درخواست" %}</button>
  <a href="{% url 'dormitory:leave_list' %}" class="btn btn-ghost">{% trans "انصراف" %}</a>
</form>
</div>
</div></div></div>
{% endblock %}
